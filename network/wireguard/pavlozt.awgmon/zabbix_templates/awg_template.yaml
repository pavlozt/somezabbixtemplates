zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: cc782958b196461ba2aea150f74fb115
      name: Templates/Applications
  templates:
    - uuid: a93e12dd43ed4f29bb3f8d4dad8d9596
      template: 'AWG wireguard peers by Zabbix agent active'
      name: 'AWG wireguard peers by Zabbix agent active'
      description: |
        Special version of the template with consideration for Amnezia WG installed in Docker.
        A Python script that outputs JSON must be installed. See additional ansible role.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 41dd545739c141a89c9def2391ea3c03
          name: 'Wireguard peers master'
          type: ZABBIX_ACTIVE
          key: awg.peers
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Master item for Wireguard stats about peers'
      discovery_rules:
        - uuid: 034727b24ee942cfa5ddd0174192788c
          name: 'Wireguard peer discovery'
          type: DEPENDENT
          key: wireguard.peer.discovery
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Wireguard peer discovery rule'
          item_prototypes:
            - uuid: 03c303f16a894efca4929fe0a380e72b
              name: 'Wireguard {#PEER_NAME} ({#PEERNO}): Last handshake'
              type: DEPENDENT
              key: 'wireguard.handshake[{#PUBLIC_KEY}]'
              delay: '0'
              units: unixtime
              description: 'Last handshake for peer {#PEER_NAME} (peerno {#PEERNO})'
              tags:
                - tag: component
                  value: network
                - tag: target
                  value: wireguard
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.publicKey=="{#PUBLIC_KEY}")].latestHandshake.first()'
              master_item:
                key: awg.peers
              trigger_prototypes:
                - uuid: 55e42fefd17c4033997510f84bfe3a9f
                  expression: 'now()-last(/AWG wireguard peers by Zabbix agent active/wireguard.handshake[{#PUBLIC_KEY}])>{$WG.HANDSHAKE.MAX_AGE}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'now()-last(/AWG wireguard peers by Zabbix agent active/wireguard.handshake[{#PUBLIC_KEY}])<{$WG.HANDSHAKE.MAX_AGE}'
                  name: 'Wireguard {#PEER_NAME} ({#PEERNO}): Peer is lost (no handshake)'
                  priority: HIGH
                  description: |
                    No handshake from WireGuard peer {#PEER_NAME}
                    for more than {$WG.HANDSHAKE.MAX_AGE} seconds.
            - uuid: fa26f2207a0849f784c72cfc4e58909b
              name: 'Wireguard {#PEER_NAME} ({#PEERNO}): Bytes received per second'
              type: DEPENDENT
              key: 'wireguard.rx[{#PUBLIC_KEY},bps]'
              delay: '0'
              units: Bps
              description: 'Number of bytes received per second for peer {#PEER_NAME} (peerno {#PEERNO})'
              tags:
                - tag: component
                  value: network
                - tag: target
                  value: wireguard
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.publicKey=="{#PUBLIC_KEY}")].transferRx.first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: awg.peers
            - uuid: 5c97be5947de440ba20774069bbb8ac8
              name: 'Wireguard {#PEER_NAME} ({#PEERNO}): Total bytes received'
              type: DEPENDENT
              key: 'wireguard.rx[{#PUBLIC_KEY}]'
              delay: '0'
              units: B
              description: 'Number of bytes received for peer {#PEER_NAME} (peerno {#PEERNO})'
              tags:
                - tag: component
                  value: network
                - tag: target
                  value: wireguard
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.publicKey=="{#PUBLIC_KEY}")].transferRx.first()'
              master_item:
                key: awg.peers
            - uuid: 5ae569fe241d432fbe1b8b5e20993d89
              name: 'Wireguard {#PEER_NAME} ({#PEERNO}): Bytes sent per second'
              type: DEPENDENT
              key: 'wireguard.tx[{#PUBLIC_KEY},bps]'
              delay: '0'
              units: Bps
              description: 'Number of bytes sent per second for peer {#PEER_NAME} (peerno {#PEERNO})'
              tags:
                - tag: component
                  value: network
                - tag: target
                  value: wireguard
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.publicKey=="{#PUBLIC_KEY}")].transferTx.first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: awg.peers
            - uuid: e36980686d89491b9760394c5c49b7f5
              name: 'Wireguard {#PEER_NAME} ({#PEERNO}): Total bytes sent'
              type: DEPENDENT
              key: 'wireguard.tx[{#PUBLIC_KEY}]'
              delay: '0'
              units: B
              description: 'Number of bytes sent for peer {#PEER_NAME} (peerno {#PEERNO})'
              tags:
                - tag: component
                  value: network
                - tag: target
                  value: wireguard
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$..[?(@.publicKey=="{#PUBLIC_KEY}")].transferTx.first()'
              master_item:
                key: awg.peers
          graph_prototypes:
            - uuid: 75eb76fa4f73435d9e2de8cb1920a980
              name: 'Wireguard {#PEER_NAME} ({#PEERNO}): Network traffic'
              graph_items:
                - color: FF7043
                  calc_fnc: ALL
                  item:
                    host: 'AWG wireguard peers by Zabbix agent active'
                    key: 'wireguard.rx[{#PUBLIC_KEY},bps]'
                - sortorder: '1'
                  color: 0080FF
                  calc_fnc: ALL
                  item:
                    host: 'AWG wireguard peers by Zabbix agent active'
                    key: 'wireguard.tx[{#PUBLIC_KEY},bps]'
          master_item:
            key: awg.peers
          lld_macro_paths:
            - lld_macro: '{#PEERNO}'
              path: $.peerNo
            - lld_macro: '{#PEER_NAME}'
              path: $.peerName
            - lld_macro: '{#PUBLIC_KEY}'
              path: $.publicKey
          preprocessing:
            - type: JSONPATH
              parameters:
                - $..peers.first()
      tags:
        - tag: class
          value: service
        - tag: scope
          value: network
        - tag: target
          value: vpn
        - tag: target
          value: wireguard
      macros:
        - macro: '{$WG.HANDSHAKE.MAX_AGE}'
          value: '600'
      dashboards:
        - uuid: e95330c5357940789babfc34c4d06071
          name: 'Wireguard network traffic'
          pages:
            - widgets:
                - type: graphprototype
                  name: 'Wireguard network traffic by peers'
                  width: '72'
                  height: '10'
                  fields:
                    - type: GRAPH_PROTOTYPE
                      name: graphid
                      value:
                        host: 'AWG wireguard peers by Zabbix agent active'
                        name: 'Wireguard {#PEER_NAME} ({#PEERNO}): Network traffic'
                    - type: STRING
                      name: reference
                      value: AAAAA
                    - type: INTEGER
                      name: rows
                      value: '2'